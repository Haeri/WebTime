name: Release macOS build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag and app versions match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION." >&2
            exit 1
          fi

      - name: Run self-tests
        run: make test

      - name: Build app and daemon
        run: make build

      - name: Assemble installer disk image
        run: |
          DMG_ROOT="$RUNNER_TEMP/Web Time"
          PAYLOAD_ROOT="$DMG_ROOT/.web-time"
          mkdir -p "$PAYLOAD_ROOT/.build/installer" "$PAYLOAD_ROOT/Resources" "$PAYLOAD_ROOT/Scripts" dist
          ditto ".build/Web Time.app" "$PAYLOAD_ROOT/.build/Web Time.app"
          cp ".build/installer/webtimed" "$PAYLOAD_ROOT/.build/installer/webtimed"
          cp Resources/local.web-time.agent.plist Resources/local.web-time.daemon.plist "$PAYLOAD_ROOT/Resources/"
          cp Scripts/install.sh Scripts/uninstall.sh "$PAYLOAD_ROOT/Scripts/"
          cp "Distribution/Install Web Time.command" "Distribution/Uninstall Web Time.command" "Distribution/README.txt" "$DMG_ROOT/"
          cp LICENSE "$DMG_ROOT/LICENSE.txt"
          chmod +x "$DMG_ROOT/Install Web Time.command" "$DMG_ROOT/Uninstall Web Time.command"
          hdiutil create -volname "Web Time" -srcfolder "$DMG_ROOT" -ov -format UDZO dist/Web-Time.dmg
          shasum -a 256 dist/Web-Time.dmg > dist/Web-Time.dmg.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Web-Time.dmg \
            dist/Web-Time.dmg.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Web Time ${GITHUB_REF_NAME#v}"
