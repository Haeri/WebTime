name: Release macOS build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag and app versions match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $APP_VERSION." >&2
            exit 1
          fi

      - name: Run self-tests
        run: make test

      - name: Build app and daemon
        run: make build

      - name: Assemble installer disk image
        run: |
          DMG_ROOT="$RUNNER_TEMP/Web Time"
          mkdir -p "$DMG_ROOT" dist
          ditto ".build/Web Time Setup.app" "$DMG_ROOT/Web Time Setup.app"
          cp "Distribution/README.txt" "$DMG_ROOT/"
          cp LICENSE "$DMG_ROOT/LICENSE.txt"
          hdiutil create -volname "Web Time" -srcfolder "$DMG_ROOT" -ov -format UDZO dist/Web-Time.dmg
          codesign --force --sign - dist/Web-Time.dmg
          (cd dist && shasum -a 256 Web-Time.dmg > Web-Time.dmg.sha256)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Web-Time.dmg \
            dist/Web-Time.dmg.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Web Time ${GITHUB_REF_NAME#v}"
