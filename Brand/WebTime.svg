<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Web Time app icon</title>
  <desc id="desc">A luminous time allowance ring and clock hand on a dark rounded square.</desc>
  <defs>
    <linearGradient id="surface" x1="150" y1="80" x2="870" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c3c42"/>
      <stop offset="0.48" stop-color="#17181b"/>
      <stop offset="1" stop-color="#060708"/>
    </linearGradient>
    <linearGradient id="ring" x1="210" y1="185" x2="816" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55d6ff"/>
      <stop offset="0.52" stop-color="#24b8f2"/>
      <stop offset="1" stop-color="#4de887"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(390 275) rotate(47) scale(650)">
      <stop stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#surface)"/>
  <rect x="47" y="47" width="930" height="930" rx="210" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
  <ellipse cx="335" cy="255" rx="410" ry="330" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="294" fill="none" stroke="#fff" stroke-opacity=".11" stroke-width="78"/>
  <circle cx="512" cy="512" r="294" fill="none" stroke="url(#ring)" stroke-width="78" stroke-linecap="round" stroke-dasharray="1385 1848" transform="rotate(-90 512 512)"/>
  <circle cx="512" cy="512" r="184" fill="#090a0c" fill-opacity=".7" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <path d="M512 512 512 350M512 512 638 435" fill="none" stroke="#f7f7f8" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="512" cy="512" r="35" fill="#f7f7f8"/>
  <circle cx="512" cy="512" r="14" fill="#17181b"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#42d9ff" stroke-opacity=".16" stroke-width="20" filter="url(#shadow)"/>
</svg>
